<!-- upload.html v3.0 - sync fix 2026-06-09 -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>رفع ملف المتابعة — الموظفين</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#1d9e75;--g2:#0f6e56;--gbg:#e1f5ee;--gbd:#9fe1cb;
  --r:#e24b4a;--rbg:#fcebeb;
  --am:#ba7517;--ambg:#faeeda;--ambd:#fac775;
  --navy:#0f172a;--bg:#f0fdf4;--card:#fff;--surf:#f1f5f9;
  --tx:#0f172a;--tx2:#64748b;--tx3:#94a3b8;--bd:rgba(0,0,0,0.08)
}
html,body{min-height:100vh;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px}
.header{text-align:center;padding:24px 0 20px}
.header-icon{width:64px;height:64px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
.header-title{font-size:20px;font-weight:600;color:var(--navy);margin-bottom:4px}
.header-sub{font-size:13px;color:var(--tx2)}
.status-bar{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:500;margin-bottom:18px;width:fit-content;margin-left:auto;margin-right:auto}
.status-bar.ok{background:var(--gbg);color:var(--g2);border:1px solid var(--gbd)}
.status-bar.err{background:var(--rbg);color:#7f1d1d;border:1px solid #fca5a5}
.status-bar.wait{background:var(--ambg);color:#633806;border:1px solid var(--ambd)}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:blink 1.5s infinite;display:inline-block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.drop-zone{border:2px dashed var(--gbd);border-radius:16px;padding:36px 20px;text-align:center;background:var(--card);cursor:pointer;transition:all .2s;margin-bottom:14px;box-shadow:0 2px 8px rgba(29,158,117,.08)}
.drop-zone:hover,.drop-zone.drag{border-color:var(--g);background:rgba(29,158,117,.04)}
.dz-icon{font-size:44px;margin-bottom:10px}
.dz-title{font-size:16px;font-weight:600;color:var(--navy);margin-bottom:5px}
.dz-sub{font-size:12px;color:var(--tx2);margin-bottom:14px}
.dz-btn{background:var(--g);color:#fff;border:none;border-radius:24px;padding:11px 28px;font-size:14px;cursor:pointer;font-weight:600;box-shadow:0 3px 10px rgba(29,158,117,.3)}
.dz-btn:active{transform:scale(.97)}
.progress-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;display:none;border:1px solid var(--gbd)}
.prog-title{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:8px}
.prog-track{background:#e2e8f0;border-radius:6px;height:8px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;background:var(--g);border-radius:6px;transition:width .4s ease}
.success-card{background:var(--card);border:1.5px solid var(--gbd);border-radius:16px;padding:20px;text-align:center;margin-bottom:14px;display:none}
.success-icon{font-size:44px;margin-bottom:10px}
.success-title{font-size:16px;font-weight:600;color:var(--g2);margin-bottom:5px}
.success-sub{font-size:12px;color:var(--tx2);line-height:1.6;margin-bottom:14px}
.success-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--gbg);font-size:12px}
.success-row:last-child{border-bottom:none}
.success-lbl{color:var(--tx2)}.success-val{color:var(--navy);font-weight:500}
.sync-card{background:linear-gradient(135deg,rgba(8,145,178,.1),rgba(8,145,178,.05));border:1px solid rgba(8,145,178,.3);border-radius:12px;padding:14px;margin:12px 0;text-align:center}
.sync-card-lbl{font-size:11px;color:#0e7490;margin-bottom:4px;font-weight:600}
.sync-card-val{font-size:32px;font-weight:800;color:#0891b2}
.sync-card-sub{font-size:11px;color:#64748b;margin-top:4px}
.history-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--bd)}
.history-title{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:10px}
.hist-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--surf);font-size:12px}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0}
.hist-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-time{color:var(--tx3);font-size:11px}
.footer{text-align:center;padding:16px 0;font-size:11px;color:var(--tx3)}
.new-btn{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:13px;cursor:pointer;color:var(--tx2);width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:7px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-icon">💉</div>
    <div class="header-title">رفع ملف المتابعة</div>
    <div class="header-sub">البرنامج الوطني للتطعيم 2026</div>
  </div>
  <div class="status-bar wait" id="statusBar">
    <span id="statusDot">⏳</span>
    <span id="statusTxt">جاري الاتصال...</span>
  </div>
  <div class="drop-zone" id="dz" onclick="document.getElementById('fi').click()" ondragover="dov(event)" ondragleave="dol(event)" ondrop="dop(event)">
    <div class="dz-icon">📂</div>
    <div class="dz-title">ارفع ملف لوحة المتابعة</div>
    <div class="dz-sub">اسحب الملف هنا أو اضغط للاختيار</div>
    <button class="dz-btn" onclick="event.stopPropagation();document.getElementById('fi').click()">📎 اختر الملف</button>
  </div>
  <input type="file" id="fi" accept=".xlsx,.xls" onchange="loadFile(event)" style="display:none">
  <div class="progress-card" id="progCard">
    <div class="prog-title" id="progTitle">جاري المعالجة...</div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div class="success-card" id="successCard">
    <div class="success-icon">✅</div>
    <div class="success-title">تم الرفع بنجاح!</div>
    <div class="success-sub">البيانات أُرسلت للمدير تلقائياً<br>سيظهر التحديث على هاتفه فوراً</div>
    <div id="successDetails"></div>
    <button class="new-btn" onclick="resetUpload()">📂 رفع ملف جديد</button>
  </div>
  <div class="history-card" id="histCard" style="display:none">
    <div class="history-title">📋 آخر الملفات المرفوعة</div>
    <div id="histList"></div>
  </div>
  <div class="footer">لوحة متابعة التطعيم 2026 · رفع الملفات</div>
</div>

<script>
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let fbDb = null, uploadHistory = [];

(function(){
  try{
    firebase.initializeApp({
      apiKey:"AIzaSyAQu8K8INyELqYc-XDztspa7JTfBS0v1AE",
      projectId:"tatveem2026",
      databaseURL:"https://tatveem2026-default-rtdb.firebaseio.com",
      authDomain:"tatveem2026.firebaseapp.com"
    });
    fbDb = firebase.database();
    fbDb.ref('.info/connected').on('value', snap => {
      if(snap.val()){
        document.getElementById('statusBar').className = 'status-bar ok';
        document.getElementById('statusDot').innerHTML = '<span class="dot"></span>';
        document.getElementById('statusTxt').textContent = 'متصل · جاهز للرفع';
        loadHistory();
      } else {
        document.getElementById('statusBar').className = 'status-bar err';
        document.getElementById('statusDot').textContent = '❌';
        document.getElementById('statusTxt').textContent = 'انقطع الاتصال...';
      }
    });
  } catch(e){
    document.getElementById('statusBar').className = 'status-bar err';
    document.getElementById('statusTxt').textContent = 'خطأ في الاتصال';
  }
})();

function dov(e){ e.preventDefault(); document.getElementById('dz').classList.add('drag'); }
function dol(e){ document.getElementById('dz').classList.remove('drag'); }
function dop(e){ e.preventDefault(); dol(e); const f = e.dataTransfer.files[0]; if(f) procFile(f); }
function loadFile(e){ const f = e.target.files[0]; if(f) procFile(f); e.target.value = ''; }

function procFile(file){
  document.getElementById('dz').style.display = 'none';
  document.getElementById('successCard').style.display = 'none';
  document.getElementById('progCard').style.display = 'block';
  setP(10, 'جاري قراءة الملف...');
  const rd = new FileReader();
  rd.onload = e => {
    try{
      setP(30, 'جاري تحليل البيانات...');
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
      const D  = parseWb(wb);
      const fileBase64 = arrayToBase64(e.target.result);
      setP(60, 'جاري الإرسال للمدير...');
      const t = nowT();
      if(fbDb){
        fbDb.ref('tatveem/latest').set({
          data:             JSON.stringify(D),
          uploadTime:       t,
          activeMonth:      Math.max(0, D.monthStats.findIndex(m => m.received > 0)),
          fileName:         file.name,
          fileBase64:       fileBase64,
          fileSize:         file.size,
          municipalities:   D.municipalities.length,
          activeMonths:     D.monthStats.filter(m => m.received > 0).length,
          uploadedBy:       'موظف',
          syncRateMonthly:  D.syncRateMonthly,
          syncRateAnnual:   D.syncRateAnnual,
          syncCountMonthly: D.syncCountMonthly,
          monthSyncStats:   D.monthSyncStats
        }).then(() => {
          setP(100, '✅ تم الإرسال بنجاح!');
          fbDb.ref('tatveem/notification').set({
            title:'💉 تحديث جديد — لوحة التطعيم',
            body:'رُفع ملف: '+file.name+' · '+t,
            time:t, ts:Date.now(), source:'upload'
          });
          const h = {name:file.name, time:t, mun:D.municipalities.length};
          uploadHistory.unshift(h);
          if(uploadHistory.length > 5) uploadHistory.pop();
          fbDb.ref('tatveem/history').set(uploadHistory);
          setTimeout(() => { document.getElementById('progCard').style.display='none'; showSuccess(file.name,t,D); }, 800);
        }).catch(err => { setP(0,'❌ خطأ: '+err.message); setTimeout(resetUpload,3000); });
      } else { setP(0,'❌ غير متصل'); setTimeout(resetUpload,2000); }
    } catch(err){ setP(0,'❌ خطأ: '+err.message); setTimeout(resetUpload,2000); }
  };
  rd.readAsArrayBuffer(file);
}

function setP(pct,lbl){
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progTitle').textContent = lbl;
}

function showSuccess(name,time,D){
  const selIdx  = MONTHS.indexOf(D.selectedMonth);
  const selSync = selIdx >= 0 ? D.monthSyncStats[selIdx] : null;
  const syncPct = selSync ? (selSync.syncRate*100).toFixed(1)+'%' : '—';
  const annPct  = D.syncRateAnnual != null ? (D.syncRateAnnual*100).toFixed(1)+'%' : '—';
  // DEBUG
  console.log('=== DEBUG v3.0 ===');
  console.log('selectedMonth:', D.selectedMonth, 'selIdx:', selIdx);
  console.log('selSync:', selSync);
  console.log('syncRateMonthly:', D.syncRateMonthly);
  if(D.monthSyncStats) D.monthSyncStats.forEach((m,i)=>console.log('month['+i+']',m.month,m.syncCount,m.syncRate));
  // DEBUG مرئي في الصفحة
  const dbgHtml = `<div style="background:#1e293b;color:#4ade80;padding:10px;border-radius:8px;margin-bottom:10px;font-size:11px;font-family:monospace;direction:ltr;text-align:left">
    v3.0 DEBUG<br>
    selectedMonth: ${D.selectedMonth} (idx:${selIdx})<br>
    syncRateMonthly: ${(D.syncRateMonthly*100).toFixed(1)}%<br>
    syncCountMonthly: ${D.syncCountMonthly}<br>
    may_syncRate: ${D.monthSyncStats&&D.monthSyncStats[4]?(D.monthSyncStats[4].syncRate*100).toFixed(1)+'%':'N/A'}<br>
    may_syncCount: ${D.monthSyncStats&&D.monthSyncStats[4]?D.monthSyncStats[4].syncCount:'N/A'}
  </div>`;

  document.getElementById('successDetails').innerHTML = dbgHtml + `
    <div class="success-row"><span class="success-lbl">اسم الملف</span><span class="success-val">${name}</span></div>
    <div class="success-row"><span class="success-lbl">وقت الرفع</span><span class="success-val">${time}</span></div>
    <div class="success-row"><span class="success-lbl">عدد البلديات</span><span class="success-val">${D.municipalities.length} بلدية</span></div>
    <div class="success-row"><span class="success-lbl">الأشهر المكتملة</span><span class="success-val">${D.monthStats.filter(m=>m.received>0).length} شهر</span></div>
    <div class="sync-card">
      <div class="sync-card-lbl">🔄 نسبة التزامن — ${D.selectedMonth||'—'}</div>
      <div class="sync-card-val">${syncPct}</div>
      <div class="sync-card-sub">التزامن السنوي: ${annPct} · ${selSync?selSync.syncCount:0} بلدية متزامنة</div>
    </div>`;
  document.getElementById('successCard').style.display = 'block';
  loadHistory();
}

function resetUpload(){
  document.getElementById('successCard').style.display = 'none';
  document.getElementById('progCard').style.display    = 'none';
  document.getElementById('dz').style.display          = 'block';
}

function loadHistory(){
  if(!fbDb) return;
  fbDb.ref('tatveem/history').once('value', snap => {
    const h = snap.val();
    if(!h||!h.length) return;
    uploadHistory = h;
    document.getElementById('histCard').style.display = 'block';
    document.getElementById('histList').innerHTML = h.map(i =>
      `<div class="hist-item"><div class="hist-dot"></div><div class="hist-name">${i.name}</div><div class="hist-time">${i.time}</div></div>`
    ).join('');
  });
}

function arrayToBase64(buf){
  const bytes=new Uint8Array(buf); let b=''; const c=8192;
  for(let i=0;i<bytes.length;i+=c) b+=String.fromCharCode(...bytes.subarray(i,Math.min(i+c,bytes.length)));
  return btoa(b);
}

// ══════════════════════════════════════════════════════════════
//  parseWb — قراءة التواريخ من cell objects مباشرة
//
//  قاعدة التزامن المطابقة للإكسل:
//  الشهر i متزامن إذا كان تاريخ إرساله في اليوم 5 أو 6
//  من الشهر التالي (i+2).
//
//  طريقة القراءة: ws[cell_address] مباشرة بدل sheet_to_json
//  لأن sheet_to_json مع raw:false يُحوّل التواريخ لنصوص
//  بتنسيق غامض يختلف حسب الـ locale.
// ══════════════════════════════════════════════════════════════
function parseWb(wb){
  const d = {};

  // ── دالة قراءة خلية بأمان مع تحديد النوع ──
  // تُرجع {type:'d'|'s'|'n'|'', value} 
  function readCell(ws, row, col){
    // row,col: 0-based
    const addr = XLSX.utils.encode_cell({r: row, c: col});
    const cell = ws[addr];
    if(!cell) return {type:'', value:null};
    return {type: cell.t || '', value: cell.v};
  }

  // ── استخرج شهر ويوم من cell بشكل موثوق ──
  // type='d' → cell.v = Date object
  // type='n' → cell.v = Excel serial number  
  // type='s' → cell.v = string نصي
  function getCellMonthDay(ws, row, col){
    const {type, value} = readCell(ws, row, col);
    if(!value && value !== 0) return null;

    if(type === 'd'){
      // Date object — يجب استخدام UTC لتجنب اختلاف الـ timezone
      const dt = value instanceof Date ? value : new Date(value);
      if(isNaN(dt.getTime())) return null;
      return { month: dt.getUTCMonth()+1, day: dt.getUTCDate() };
    }

    if(type === 'n'){
      // Excel serial → UTC date
      const dt = new Date(Math.round((value - 25569) * 86400 * 1000));
      return { month: dt.getUTCMonth()+1, day: dt.getUTCDate() };
    }

    if(type === 's'){
      const s = String(value).trim();
      // ISO: 2026-06-05
      const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(iso) return { month: parseInt(iso[2],10), day: parseInt(iso[3],10) };
      // DD/MM/YYYY
      const slash = s.match(/^(\d{1,2})\/(\d{1,2})\/\d{2,4}$/);
      if(slash) return { month: parseInt(slash[2],10), day: parseInt(slash[1],10) };
    }

    return null;
  }

  // ── شيت المتابعة ──
  const wsT = wb.Sheets['المتابعة'];
  if(!wsT){ d.trackHeaders=[]; d.trackRows=[]; d.municipalities=[]; }
  else {
    const rawT = XLSX.utils.sheet_to_json(wsT, {header:1, defval:'', raw:true});
    d.trackHeaders   = rawT[2] || [];
    d.trackRows      = rawT.slice(3).filter(r => r[0] && String(r[0]).trim());
    d.municipalities = d.trackRows.map(r => String(r[0]).trim());
  }
  const total = d.municipalities.length;

  // ── احسب monthStats و monthSyncStats ──
  d.monthStats     = [];
  d.monthSyncStats = [];

  MONTHS.forEach((mn, mi) => {
    const statusColIdx = 1 + mi*2;  // 0-based column index
    const dateColIdx   = 2 + mi*2;

    // الشهر التالي: مايو(i=4) → شهر 6، ديسمبر(i=11) → شهر 1
    const nextMonth = mi < 11 ? mi + 2 : 1;

    let recv = 0, onTime = 0;
    const missList = [];

    // نبدأ من row 3 (0-based) = الصف 4 في إكسل
    for(let rowIdx = 3; rowIdx < 3 + total + 10; rowIdx++){
      const nameCell   = readCell(wsT, rowIdx, 0);
      if(!nameCell.value) continue;
      const name       = String(nameCell.value).trim();
      if(!name) continue;

      const statusCell = readCell(wsT, rowIdx, statusColIdx);
      const status     = String(statusCell.value || '').trim();

      if(status === 'تم' || status === '✓'){
        recv++;
        const md = getCellMonthDay(wsT, rowIdx, dateColIdx);
        // ✅ التزامن: يوم 5 أو 6 من الشهر التالي
        if(md && md.month === nextMonth && (md.day === 5 || md.day === 6)){
          onTime++;
        }
      } else {
        missList.push(name);
      }
    }

    d.monthStats.push({
      month: mn, idx: mi, total,
      received:    recv,
      notReceived: total - recv,
      rate:        total > 0 ? recv / total : 0,
      missList
    });
    d.monthSyncStats.push({
      month:     mn,
      syncCount: onTime,
      syncRate:  total > 0 ? onTime / total : 0
    });
  });

  // ── الشهر المختار من Dashboard B3 ──
  d.selectedMonth = '';
  const wsDash = wb.Sheets['Dashboard'];
  if(wsDash){
    const b3 = wsDash['B3'];
    if(b3) d.selectedMonth = String(b3.v || '').trim();
  }

  // نسبة التزامن للشهر المختار
  const selIdx = MONTHS.indexOf(d.selectedMonth);
  if(selIdx >= 0){
    d.syncRateMonthly  = d.monthSyncStats[selIdx].syncRate;
    d.syncCountMonthly = d.monthSyncStats[selIdx].syncCount;
  } else {
    let last = null;
    for(let i = 11; i >= 0; i--){
      if(d.monthStats[i].received > 0){ last = d.monthSyncStats[i]; break; }
    }
    d.syncRateMonthly  = last ? last.syncRate  : 0;
    d.syncCountMonthly = last ? last.syncCount : 0;
  }

  // نسبة التزامن السنوية
  const withData = d.monthSyncStats.filter((_,i) => d.monthStats[i].received > 0);
  d.syncRateAnnual = withData.length > 0
    ? withData.reduce((s,m) => s + m.syncRate, 0) / withData.length
    : 0;

  // ── شيت الخريطة الحرارية ──
  const wsH  = wb.Sheets['الخريطة الحرارية'];
  const rawH = wsH ? XLSX.utils.sheet_to_json(wsH,{header:1,defval:'',raw:true}) : [];
  d.hmRows = rawH.slice(3).filter(r=>r[0]&&String(r[0]).trim()).map(r=>({
    name:   String(r[0]).trim(),
    months: Array.from({length:12},(_,i)=>String(r[i+1]||'').trim()),
    total:  parseInt(r[13])||0
  }));

  // ── شيت البيانات ──
  const wsData  = wb.Sheets['البيانات'];
  const rawData = wsData ? XLSX.utils.sheet_to_json(wsData,{header:1,defval:'',raw:true}) : [];
  d.dataHeaders = rawData[2] || [];
  d.dataRows    = rawData.slice(3).filter(r=>r[1]&&String(r[1]).trim());

  return d;
}

function nowT(){
  return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
// ── تحقق من الإصدار ──
console.log('%c upload.html v3.0 ✅ الإصدار الصحيح محمّل', 'color:green;font-size:16px;font-weight:bold');
console.log('إذا رأيت هذا فالكود الجديد يعمل — المشكلة كانت في cache المتصفح');
</script>
</body>
</html>
