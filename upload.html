<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رفع ملف المتابعة — الموظفين</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--g:#1d9e75;--g2:#0f6e56;--gbg:#e1f5ee;--gbd:#9fe1cb;--r:#e24b4a;--rbg:#fcebeb;--am:#ba7517;--ambg:#faeeda;--ambd:#fac775;--navy:#0f172a;--bg:#f0fdf4;--card:#fff;--surf:#f1f5f9;--tx:#0f172a;--tx2:#64748b;--tx3:#94a3b8;--bd:rgba(0,0,0,0.08)}
html,body{min-height:100vh;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px}
/* HEADER */
.header{text-align:center;padding:24px 0 20px}
.header-icon{width:64px;height:64px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
.header-title{font-size:20px;font-weight:600;color:var(--navy);margin-bottom:4px}
.header-sub{font-size:13px;color:var(--tx2)}
/* STATUS */
.status-bar{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:500;margin-bottom:18px;width:fit-content;margin-left:auto;margin-right:auto}
.status-bar.ok{background:var(--gbg);color:var(--g2);border:1px solid var(--gbd)}
.status-bar.err{background:var(--rbg);color:#7f1d1d;border:1px solid #fca5a5}
.status-bar.wait{background:var(--ambg);color:#633806;border:1px solid var(--ambd)}
.dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:blink 1.5s infinite;display:inline-block}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
/* UPLOAD ZONE */
.drop-zone{border:2px dashed var(--gbd);border-radius:16px;padding:36px 20px;text-align:center;background:var(--card);cursor:pointer;transition:all .2s;margin-bottom:14px;box-shadow:0 2px 8px rgba(29,158,117,.08)}
.drop-zone:hover,.drop-zone.drag{border-color:var(--g);background:rgba(29,158,117,.04)}
.dz-icon{font-size:44px;margin-bottom:10px}
.dz-title{font-size:16px;font-weight:600;color:var(--navy);margin-bottom:5px}
.dz-sub{font-size:12px;color:var(--tx2);margin-bottom:14px}
.dz-btn{background:var(--g);color:#fff;border:none;border-radius:24px;padding:11px 28px;font-size:14px;cursor:pointer;font-weight:600;box-shadow:0 3px 10px rgba(29,158,117,.3)}
.dz-btn:active{transform:scale(.97)}
/* PROGRESS */
.progress-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;display:none;border:1px solid var(--gbd);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.prog-title{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:8px}
.prog-track{background:#e2e8f0;border-radius:6px;height:8px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;background:var(--g);border-radius:6px;transition:width .4s ease}
.prog-detail{font-size:11px;color:var(--tx2)}
/* SUCCESS */
.success-card{background:var(--card);border:1.5px solid var(--gbd);border-radius:16px;padding:20px;text-align:center;margin-bottom:14px;display:none;box-shadow:0 4px 14px rgba(29,158,117,.12)}
.success-icon{font-size:44px;margin-bottom:10px}
.success-title{font-size:16px;font-weight:600;color:var(--g2);margin-bottom:5px}
.success-sub{font-size:12px;color:var(--tx2);line-height:1.6;margin-bottom:14px}
.success-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--gbg);font-size:12px}
.success-row:last-child{border-bottom:none}
.success-lbl{color:var(--tx2)}
.success-val{color:var(--navy);font-weight:500}
/* HISTORY */
.history-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--bd);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.history-title{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hist-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--surf);font-size:12px}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:50%;background:var(--g);flex-shrink:0}
.hist-name{flex:1;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-time{color:var(--tx3);font-size:11px;white-space:nowrap}
/* FOOTER */
.footer{text-align:center;padding:16px 0;font-size:11px;color:var(--tx3)}
/* NEW UPLOAD BTN */
.new-btn{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:13px;cursor:pointer;color:var(--tx2);width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:7px}
.new-btn:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-icon">💉</div>
    <div class="header-title">رفع ملف المتابعة</div>
    <div class="header-sub">البرنامج الوطني للتطعيم 2026</div>
  </div>

  <div class="status-bar wait" id="statusBar">
    <span id="statusDot">⏳</span>
    <span id="statusTxt">جاري الاتصال...</span>
  </div>

  <div class="drop-zone" id="dz" onclick="document.getElementById('fi').click()" ondragover="dov(event)" ondragleave="dol(event)" ondrop="dop(event)">
    <div class="dz-icon">📂</div>
    <div class="dz-title">ارفع ملف لوحة المتابعة</div>
    <div class="dz-sub">اسحب الملف هنا أو اضغط للاختيار</div>
    <button class="dz-btn" onclick="event.stopPropagation();document.getElementById('fi').click()">📎 اختر الملف</button>
  </div>
  <input type="file" id="fi" accept=".xlsx,.xls" onchange="loadFile(event)" style="display:none">

  <div class="progress-card" id="progCard">
    <div class="prog-title" id="progTitle">جاري المعالجة...</div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-detail" id="progDetail"></div>
  </div>

  <div class="success-card" id="successCard">
    <div class="success-icon">✅</div>
    <div class="success-title">تم الرفع بنجاح!</div>
    <div class="success-sub">البيانات أُرسلت للمدير تلقائياً<br>سيظهر التحديث على هاتفه فوراً</div>
    <div id="successDetails"></div>
    <button class="new-btn" onclick="resetUpload()">📂 رفع ملف جديد</button>
  </div>

  <div class="history-card" id="histCard" style="display:none">
    <div class="history-title">📋 آخر الملفات المرفوعة</div>
    <div id="histList"></div>
  </div>

  <div class="footer">لوحة متابعة التطعيم 2026 · رفع الملفات</div>
</div>

<script>
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let fbDb=null, uploadHistory=[];

// INIT FIREBASE
(function(){
  try{
    firebase.initializeApp({
      apiKey:"AIzaSyAQu8K8INyELqYc-XDztspa7JTfBS0v1AE",
      projectId:"tatveem2026",
      databaseURL:"https://tatveem2026-default-rtdb.firebaseio.com",
      authDomain:"tatveem2026.firebaseapp.com"
    });
    fbDb=firebase.database();
    fbDb.ref('.info/connected').on('value',snap=>{
      if(snap.val()){
        document.getElementById('statusBar').className='status-bar ok';
        document.getElementById('statusDot').innerHTML='<span class="dot"></span>';
        document.getElementById('statusTxt').textContent='متصل · جاهز للرفع';
        loadHistory();
      } else {
        document.getElementById('statusBar').className='status-bar err';
        document.getElementById('statusDot').textContent='❌';
        document.getElementById('statusTxt').textContent='انقطع الاتصال...';
      }
    });
  }catch(e){
    document.getElementById('statusBar').className='status-bar err';
    document.getElementById('statusTxt').textContent='خطأ في الاتصال';
  }
})();

function dov(e){e.preventDefault();document.getElementById('dz').classList.add('drag')}
function dol(e){document.getElementById('dz').classList.remove('drag')}
function dop(e){e.preventDefault();dol(e);const f=e.dataTransfer.files[0];if(f)procFile(f)}
function loadFile(e){const f=e.target.files[0];if(f)procFile(f);e.target.value=''}

function procFile(file){
  document.getElementById('dz').style.display='none';
  document.getElementById('successCard').style.display='none';
  const pc=document.getElementById('progCard');
  pc.style.display='block';
  setP(10,'جاري قراءة الملف...');
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      setP(30,'جاري تحليل البيانات...');
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const D=parseWb(wb);
      setP(60,'جاري الإرسال للمدير...');
      const t=nowT();
      const activeMonth=D.monthStats.findIndex(m=>m.received>0);
      const activeMonths=D.monthStats.filter(m=>m.received>0).length;
      if(fbDb){
        fbDb.ref('tatveem/latest').set({
          data:JSON.stringify(D),
          uploadTime:t,
          activeMonth:activeMonth>=0?activeMonth:0,
          fileName:file.name,
          municipalities:D.municipalities.length,
          activeMonths,
          uploadedBy:'موظف'
        }).then(()=>{
          setP(100,'✅ تم الإرسال بنجاح!');
          // Notify all viewers via Firebase
          fbDb.ref('tatveem/notification').set({
            title:'💉 تحديث جديد — لوحة التطعيم',
            body:'رُفع ملف: ' + file.name + ' · ' + t,
            time: t
          });
          // save to history
          const h={name:file.name,time:t,mun:D.municipalities.length};
          uploadHistory.unshift(h);
          if(uploadHistory.length>5) uploadHistory.pop();
          if(fbDb) fbDb.ref('tatveem/history').set(uploadHistory);
          setTimeout(()=>{
            pc.style.display='none';
            showSuccess(file.name,t,D);
          },800);
        }).catch(err=>{
          setP(0,'❌ خطأ: '+err.message);
          setTimeout(()=>resetUpload(),3000);
        });
      } else {
        setP(0,'❌ غير متصل بالشبكة');
        setTimeout(()=>resetUpload(),2000);
      }
    }catch(err){
      setP(0,'❌ خطأ في قراءة الملف');
      setTimeout(()=>resetUpload(),2000);
    }
  };
  rd.readAsArrayBuffer(file);
}

function setP(pct,lbl){
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progTitle').textContent=lbl;
}

function showSuccess(name,time,D){
  const s=D.monthStats.find(m=>m.received>0)||D.monthStats[0];
  document.getElementById('successDetails').innerHTML=`
    <div class="success-row"><span class="success-lbl">اسم الملف</span><span class="success-val">${name}</span></div>
    <div class="success-row"><span class="success-lbl">وقت الرفع</span><span class="success-val">${time}</span></div>
    <div class="success-row"><span class="success-lbl">عدد البلديات</span><span class="success-val">${D.municipalities.length} بلدية</span></div>
    <div class="success-row"><span class="success-lbl">الأشهر المكتملة</span><span class="success-val">${D.monthStats.filter(m=>m.received>0).length} شهر</span></div>
  `;
  document.getElementById('successCard').style.display='block';
  loadHistory();
}

function resetUpload(){
  document.getElementById('successCard').style.display='none';
  document.getElementById('progCard').style.display='none';
  document.getElementById('dz').style.display='block';
}

function loadHistory(){
  if(!fbDb) return;
  fbDb.ref('tatveem/history').once('value',snap=>{
    const h=snap.val();
    if(!h||!h.length) return;
    uploadHistory=h;
    const hc=document.getElementById('histCard');
    hc.style.display='block';
    document.getElementById('histList').innerHTML=h.map(i=>`
      <div class="hist-item">
        <div class="hist-dot"></div>
        <div class="hist-name">${i.name}</div>
        <div class="hist-time">${i.time}</div>
      </div>`).join('');
  });
}

function parseWb(wb){
  const d={};
  const wsT=wb.Sheets['المتابعة'];
  const rawT=wsT?XLSX.utils.sheet_to_json(wsT,{header:1,defval:''}):[];
  d.trackHeaders=rawT[2]||[];
  d.trackRows=rawT.slice(3).filter(r=>r[0]&&String(r[0]).trim());
  d.municipalities=d.trackRows.map(r=>String(r[0]).trim());
  const total=d.municipalities.length;
  d.monthStats=MONTHS.map((mn,mi)=>{
    const col=1+mi*2;let recv=0;const missList=[];
    d.trackRows.forEach(r=>{
      const v=String(r[col]||'').trim();
      if(v==='تم'||v==='✓') recv++;
      else missList.push(String(r[0]).trim());
    });
    return{month:mn,idx:mi,total,received:recv,notReceived:total-recv,rate:total>0?recv/total:0,missList};
  });
  const wsH=wb.Sheets['الخريطة الحرارية'];
  const rawH=wsH?XLSX.utils.sheet_to_json(wsH,{header:1,defval:''}):[];
  d.hmRows=rawH.slice(3).filter(r=>r[0]&&String(r[0]).trim()).map(r=>({
    name:String(r[0]).trim(),months:Array.from({length:12},(_,i)=>String(r[i+1]||'').trim()),total:parseInt(r[13])||0
  }));
  const wsD=wb.Sheets['البيانات'];
  const rawD=wsD?XLSX.utils.sheet_to_json(wsD,{header:1,defval:''}):[];
  d.dataHeaders=rawD[2]||[];
  d.dataRows=rawD.slice(3).filter(r=>r[1]&&String(r[1]).trim());
  return d;
}

function nowT(){return new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
</script>
</body>
</html>
